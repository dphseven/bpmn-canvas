<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPMN Canvas Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/ui.css" />
  <link rel="stylesheet" href="src/styles/canvas.css" />
  <link rel="stylesheet" href="src/styles/nodes.css" />
</head>
<body>
  <div id="app-container">
    <!-- Header Navigation -->
    <header class="top-nav">
      <div class="brand-section">
        <span class="brand-badge">BPMN Canvas</span>
        <span class="brand-title">Workflow Studio</span>
        <span class="brand-subtitle">Native HTML + SVG Architecture</span>
      </div>

      <div class="nav-actions">
        <button class="btn" id="btn-theme-toggle" title="Toggle Theme">
          <span>🌙</span> <span id="theme-label">Dark</span>
        </button>
        <button class="btn" id="btn-simulate" title="Simulate Token Flow" style="border-color: var(--border-focus)">
          <span>▶</span> <span id="sim-label">Pause Flow</span>
        </button>
        <button class="btn" id="btn-snap-toggle" title="Snap to Grid" style="border-color: var(--border-focus)">
          <span>🧲</span> Grid Snap: <span id="snap-status">On</span>
        </button>
        <button class="btn" id="btn-export-json">
          <span>📥</span> Export JSON
        </button>
        <button class="btn" id="btn-import-json">
          <span>📤</span> Import JSON
        </button>
        <input type="file" id="file-import-input" accept=".json,application/json" style="display: none;" />
        <button class="btn" id="btn-demo-flow">
          <span>✨</span> Demo Flow
        </button>
        <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
          <span>↩</span> Undo
        </button>
        <button class="btn" id="btn-redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>
          <span>↪</span> Redo
        </button>
        <button class="btn btn-primary" id="btn-fit-view">
          <span>🎯</span> Fit View
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Drag & Drop Node Palette -->
      <aside id="palette-container"></aside>

      <!-- Infinite Interactive Canvas -->
      <div id="canvas-container">
        <!-- Drag & Drop JSON Import Overlay -->
        <div class="canvas-drop-overlay" id="canvas-drop-overlay">
          <div class="drop-icon">📥</div>
          <div class="drop-title">Drop BPMN JSON Model Here</div>
          <div class="drop-subtitle">Release file to import and load workflow onto canvas</div>
        </div>
      </div>

      <!-- Live Properties Inspector -->
      <aside id="inspector-container"></aside>

      <!-- Floating Viewport Navigation Toolbar -->
      <div class="floating-controls">
        <button class="control-btn" id="ctrl-zoom-out" title="Zoom Out">−</button>
        <span class="zoom-indicator" id="ctrl-zoom-level">100%</span>
        <button class="control-btn" id="ctrl-zoom-in" title="Zoom In">+</button>
        <div class="control-divider"></div>
        <button class="control-btn" id="ctrl-reset-view" title="Reset View (100%)">⟲</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { BpmnCanvas, Palette, Inspector } from './src/index.js';

    // 1. Initialize Canvas
    const canvasContainer = document.getElementById('canvas-container');
    const canvas = new BpmnCanvas(canvasContainer, {
      defaultRouting: 'bezier',
      snapToGrid: true
    });
    window.canvas = canvas;

    // 2. Initialize Palette & Inspector
    const palette = new Palette(document.getElementById('palette-container'), canvas);
    const inspector = new Inspector(document.getElementById('inspector-container'), canvas);
    window.palette = palette;
    window.inspector = inspector;

    // 3. Load Rich Sample Workflow
    function loadSampleWorkflow() {

          {

          {

            x: 742,

            }
          },
          {
            id: "node_1792872602067_s2c4u",
            type: "service-task",

            x: 357,

          {

        edges: [
          {

          },
          {

          },
          {
            id: "edge_1792872644921_uazi9",
            sourceId: "node_1792872587195_m4eby",
            targetId: "node_1792872602067_s2c4u",
            sourcePort: "right",
            targetPort: "left",
            label: "",
            routing: "bezier",
            animated: true
          },
          {
            id: "edge_1792872647217_eqsi1",
            sourceId: "node_1792872602067_s2c4u",
            targetId: "node_1792872623148_k3eq9",
            sourcePort: "right",
            targetPort: "left",
            label: "",
            routing: "bezier",
            animated: true
          },
          {
            id: "edge_1792872649719_7l2u3",
            sourceId: "node_1792872623148_k3eq9",
            targetId: "node_1792872590256_blfne",
            sourcePort: "right",
            targetPort: "left",
            label: "",
            routing: "bezier",
            animated: true
          }
        ]
      };

      canvas.loadData(sample);
    }

    loadSampleWorkflow();

    // 4. Viewport Controls & Indicators
    const zoomLevelEl = document.getElementById('ctrl-zoom-level');
    canvas.on('viewport:change', ({ zoom }) => {
      zoomLevelEl.textContent = `${Math.round(zoom * 100)}%`;
    });

    document.getElementById('ctrl-zoom-in').addEventListener('click', () => {
      canvas.setZoom(canvas.zoom * 1.2);
    });

    document.getElementById('ctrl-zoom-out').addEventListener('click', () => {
      canvas.setZoom(canvas.zoom / 1.2);
    });

    document.getElementById('ctrl-reset-view').addEventListener('click', () => {
      canvas.resetViewport();
    });

    document.getElementById('btn-fit-view').addEventListener('click', () => {
      canvas.fitView();
    });

    // 5. Token Flow Simulation Toggle
    const simBtn = document.getElementById('btn-simulate');
    const simLabel = document.getElementById('sim-label');
    simBtn.addEventListener('click', () => {
      canvas.toggleSimulation();
    });

    canvas.on('simulation:start', () => {
      simLabel.textContent = 'Pause Flow';
      simBtn.style.borderColor = 'var(--border-focus)';
    });

    canvas.on('simulation:stop', () => {
      simLabel.textContent = 'Play Flow';
      simBtn.style.borderColor = 'var(--border-color)';
    });

    // 6. Grid Snap Toggle
    const snapBtn = document.getElementById('btn-snap-toggle');
    const snapStatus = document.getElementById('snap-status');
    snapBtn.addEventListener('click', () => {
      canvas.options.snapToGrid = !canvas.options.snapToGrid;
      snapStatus.textContent = canvas.options.snapToGrid ? 'On' : 'Off';
      snapBtn.style.borderColor = canvas.options.snapToGrid ? 'var(--border-focus)' : 'var(--border-color)';
    });

    // 7. Theme Toggle (Dark / Light)
    const themeBtn = document.getElementById('btn-theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    let isLight = false;
    themeBtn.addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('theme-light', isLight);
      themeLabel.textContent = isLight ? 'Light' : 'Dark';
    });

    // Toast Notification helper
    function showToast(message, type = 'success') {
      let toast = document.querySelector('.bpmn-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'bpmn-toast';
        document.body.appendChild(toast);
      }
      toast.className = `bpmn-toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '⚠️'}</span><span>${message}</span>`;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // Common JSON Loader with validation
    function importWorkflowJson(jsonText) {
      try {
        const parsed = JSON.parse(jsonText);
        if (!parsed || typeof parsed !== 'object') {
          throw new Error('Invalid JSON format: root must be an object.');
        }
        if (!Array.isArray(parsed.nodes)) {
          throw new Error('Invalid BPMN model: "nodes" array is required.');
        }

        canvas.loadData(parsed);
        showToast(`Workflow imported successfully (${parsed.nodes.length} nodes, ${(parsed.edges || []).length} sequence flows)`);
        
        // Auto start simulation on successful import
        setTimeout(() => {
          canvas.startSimulation();
          simLabel.textContent = 'Pause Flow';
          simBtn.style.borderColor = 'var(--border-focus)';
        }, 150);
      } catch (err) {
        console.error('Error importing JSON workflow:', err);
        showToast(`Failed to load JSON: ${err.message}`, 'error');
      }
    }

    // 8. Export / Import Data
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const data = canvas.exportData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bpmn-workflow.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Workflow JSON downloaded');
    });

    const fileImportInput = document.getElementById('file-import-input');
    const importBtn = document.getElementById('btn-import-json');

    // Trigger file chooser dialog
    importBtn.addEventListener('click', () => {
      fileImportInput.value = '';
      fileImportInput.click();
    });

    // Handle file selection
    fileImportInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        importWorkflowJson(evt.target.result);
      };
      reader.onerror = () => {
        showToast('Error reading the selected file', 'error');
      };
      reader.readAsText(file);
    });

    // Handle Drag and Drop JSON onto Canvas
    const dropOverlay = document.getElementById('canvas-drop-overlay');
    let dragCounter = 0;

    canvasContainer.addEventListener('dragenter', (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add('active');
      }
    });

    canvasContainer.addEventListener('dragover', (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }
    });

    canvasContainer.addEventListener('dragleave', (e) => {
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) {
        dropOverlay.classList.remove('active');
      }
    });

    canvasContainer.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');

      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;

      const file = files[0];
      if (!file.name.endsWith('.json') && file.type !== 'application/json') {
        showToast('Please drop a valid .json file', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (evt) => {
        importWorkflowJson(evt.target.result);
      };
      reader.onerror = () => {
        showToast('Error reading dropped file', 'error');
      };
      reader.readAsText(file);
    });

    // Demo Flow button
    document.getElementById('btn-demo-flow').addEventListener('click', () => {
      loadSampleWorkflow();
      canvas.startSimulation();
      simLabel.textContent = 'Pause Flow';
      simBtn.style.borderColor = 'var(--border-focus)';
      showToast('Loaded demo workflow');
    });

    // 9. Undo & Redo Controls
    const undoBtn = document.getElementById('btn-undo');
    const redoBtn = document.getElementById('btn-redo');

    undoBtn.addEventListener('click', () => {
      canvas.undo();
    });

    redoBtn.addEventListener('click', () => {
      canvas.redo();
    });

    canvas.on('history:change', ({ canUndo, canRedo }) => {
      undoBtn.disabled = !canUndo;
      redoBtn.disabled = !canRedo;
    });

    // Start simulation automatically on initial load
    setTimeout(() => {
      canvas.startSimulation();
    }, 200);
  </script>
</body>
</html>
